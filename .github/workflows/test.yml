name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Release check
        run: python scripts/check_release.py --out-json demo/out/release_check_ci.json --out-md demo/out/release_check_ci.md
