name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run demo
        run: python scripts/run_demo.py
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Release audit
        run: python -m scroll_review_tooling.release_audit --root . --out-json demo/out/release_audit_ci.json
